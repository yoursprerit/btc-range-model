name: Build P&L snapshot

# Precomputes the V1/V2 universe runs behind the live cockpit and the replays behind the app's 📈 Overall-strategy-P&L section
# (every strategy view V1/V2/Combined x every UI risk profile, plus the
# price-returns matrix, buy-&-hold replay and sleeve prices) and commits them to
# the single-commit ``data-snapshots`` branch (NOT main: a ~1 MB binary per build
# would bloat the repo), which the Streamlit app downloads and reads back instantly
# instead of replaying everything on a cold start.  See
# app/pnl_snapshot.py — the app ignores a snapshot that is stale or was built by
# different engine code and falls back to computing live, so a missed run only
# costs speed, never correctness.
#
# Triggers: chained after the daily publish (which pulls the newest bar
# synchronously, so the snapshot sees it), a few best-effort cron slots as a backstop (GitHub cron is
# routinely delayed or dropped), a push that changes the engine code (the
# snapshot's code fingerprint would otherwise no longer match), and manual runs.
# The builder is idempotent: it commits nothing unless the code, data vintage or
# last bar changed.

on:
  workflow_run:
    workflows: ["Publish target book (IBKR Option C)"]
    types: [completed]
  schedule:
    - cron: "40 12 * * *"
    - cron: "40 14 * * *"
    - cron: "40 19 * * *"
  push:
    paths:
      - "app/*.py"
      - "!app/*_app.py"
      - "models/**"
      - "scripts/build_pnl_snapshot.py"
  workflow_dispatch: {}

permissions:
  contents: write

# One build at a time; a newer trigger waits rather than racing the push.
concurrency:
  group: build-pnl-snapshot
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"          # the app's pinned interpreter

      - name: Install engine dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Fetch the published snapshot (for the unchanged check)
        run: |
          set -euo pipefail
          mkdir -p snapshot-out
          if git fetch --depth=1 origin data-snapshots; then
            git show FETCH_HEAD:pnl_snapshot.pkl.xz > snapshot-out/pnl_snapshot.pkl.xz \
              || rm -f snapshot-out/pnl_snapshot.pkl.xz
          else
            echo "No data-snapshots branch yet — the first build creates it."
          fi
          cp -p snapshot-out/pnl_snapshot.pkl.xz snapshot-out/previous.xz 2>/dev/null || true

      - name: Build snapshot
        run: python scripts/build_pnl_snapshot.py --out snapshot-out/pnl_snapshot.pkl.xz

      - name: Publish to the data-snapshots branch
        run: |
          set -euo pipefail
          if [ -f snapshot-out/previous.xz ] && cmp -s snapshot-out/previous.xz snapshot-out/pnl_snapshot.pkl.xz; then
            echo "Snapshot unchanged — nothing to publish."
            exit 0
          fi
          # A one-commit orphan branch, force-pushed: the previous snapshot's
          # blob becomes unreachable, so the repository never accumulates them.
          # Nothing else lives on this branch, and nothing reads its history.
          cd snapshot-out
          rm -f previous.xz
          git init -q
          git checkout -q --orphan data-snapshots
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pnl_snapshot.pkl.xz
          git commit -q -m "P&L snapshot $(date -u +%Y-%m-%dT%H:%MZ)" \
            -m "Automated build via .github/workflows/build-pnl-snapshot.yml (single-commit branch, force-pushed)"
          git remote add origin "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"
          for attempt in 1 2 3; do
            git push --force origin data-snapshots && exit 0
            sleep $((attempt * 5))
          done
          echo "::error::Could not publish the P&L snapshot after 3 attempts."
          exit 1
