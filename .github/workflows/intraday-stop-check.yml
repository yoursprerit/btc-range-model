name: Intraday stop check (2:00 PM CT)

# Prices every HELD sleeve that carries a stop at its live quote about 20 minutes
# before the executor's 2:20 PM CT slot, and — only if a stop is breached —
# re-publishes both signed books (paper + live) without the stopped sleeves.
# Logic, guards and honest limits: scripts/intraday_stop_check.py.
#
# TIMING. The precise trigger is an external scheduler calling workflow_dispatch
# at 2:00 PM America/Chicago (docs/EXTERNAL_SCHEDULER.md § Intraday stop check),
# exactly like the 7:16 AM publish. GitHub's `on: schedule` is best-effort (fires
# land 1–3 h late or are dropped), so the cron slots below are only a backup —
# and a late fire is harmless: the script refuses to run outside 13:45–14:12 CT
# (a book must not change after the executor may have traded it) and on any day
# that is not a US trading day.
#
# It shares the publisher's concurrency group, so it can never run against a
# half-written morning book (or the other way round).
#
# Required repo secret: OVERALL_BOOK_SECRET (the same HMAC secret as the publish).
# NOTE: `on: schedule` fires only from the repo's DEFAULT branch.

on:
  workflow_dispatch: {}      # external scheduler / manual — the script's own window still applies
  schedule:
    # 2:00 PM CT is 19:00 UTC (CDT) / 20:00 UTC (CST); both offsets are listed
    # and the script's CT window decides which can act.
    - cron: "0,6,12 19,20 * * 1-5"

permissions:
  contents: write

concurrency:
  group: publish-target-book
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout (this branch)
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"          # the app's pinned interpreter (loads the model)

      - name: Install engine dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Refresh BTC feature data (same guarded pull as the morning publish)
        # The ETH/MSTR/MSTU stops read the BTC sleeve's engine state, which is
        # built from data/backtest/raw_features_daily.csv — the freshness audit
        # inside the check needs the same completed bar the morning book used.
        run: |
          set +e
          python scripts/pull_backtest_data.py
          set -e
          if ! python scripts/validate_refreshed_data.py; then
            echo "Refreshed dataset REGRESSED — restoring the committed version."
            git checkout -- data/backtest/ || true
          fi

      - name: Check live prices against the stops (re-publishes only on a breach)
        id: check
        # continue-on-error so the status marker is still committed when the
        # check could not complete; the job is failed loudly afterwards.
        continue-on-error: true
        env:
          OVERALL_BOOK_SECRET: ${{ secrets.OVERALL_BOOK_SECRET }}
        run: python scripts/intraday_stop_check.py

      - name: Commit & push the amended books + status marker
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Per path (a pathspec that matches nothing makes `git add a b` stage
          # NOTHING). Only the books, their dated record and the marker are
          # staged: a clear day changes just the marker, a breach also the books.
          for p in data/overall/target_book.json data/overall/target_book_live.json \
                   data/overall/book_archive/ data/overall/intraday_stop_check.json; do
            git add "$p" 2>/dev/null || echo "  (skipped absent path: $p)"
          done
          if git diff --cached --quiet; then
            echo "No changes — nothing to commit."
            exit 0
          fi
          STATUS="$(jq -r '.status // "unknown"' data/overall/intraday_stop_check.json 2>/dev/null || echo unknown)"
          git commit -m "chore(books): intraday stop check — ${STATUS}"
          # The amended books are the freshest output for today's date, so this
          # run's files win a rebase conflict against a concurrent data push.
          for attempt in 1 2 3; do
            git fetch origin "${GITHUB_REF_NAME}"
            if git rebase --autostash -X theirs "origin/${GITHUB_REF_NAME}"; then
              if git push origin "HEAD:${GITHUB_REF_NAME}"; then
                echo "Pushed on attempt ${attempt}."
                exit 0
              fi
            else
              git rebase --abort || true
            fi
            echo "Concurrent push on attempt ${attempt} — refetching and retrying."
            sleep $((attempt * 5))
          done
          echo "::error title=Stop-check artifacts not landed::Could not push after 3 attempts."
          exit 1

      - name: Fail loudly if the check could not complete
        if: steps.check.outcome != 'success'
        run: |
          echo "::error title=Intraday stop check failed::The 2 PM stop check did not complete (stale audit, bad signature or engine error) — the executor will trade the morning book unamended. See data/overall/intraday_stop_check.json."
          exit 1
