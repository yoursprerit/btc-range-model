name: Publish book to Collective2

# Mirrors the day's signed PAPER target book (data/overall/target_book.json)
# onto the Collective2 strategy at 9:00 AM America/Chicago — 30 minutes into
# the regular session — via scripts/publish_c2.py (SetDesiredPositions, API v4).
# Runs entirely in Actions: no dependency on the executor PC.
#
# Timing: the book is published at 7:15 AM CT by publish-target-book.yml; C2
# can only adjust positions while the market is open (8:30 AM–3:00 PM CT), so
# the anchor is 9:00 AM CT. GitHub's `on: schedule` is best-effort (fires land
# 1–3 h late or are dropped), so the precise trigger is an external scheduler
# calling workflow_dispatch at 9:00 AM CT (docs/EXTERNAL_SCHEDULER.md § C2);
# the cron slots below are hourly backups through the session.
#
# Idempotent by construction: publish_c2.py records the last book it sent in
# data/overall/c2_publish_state.json (committed back below), and skips a book
# already sent — so the dispatch, every backup slot and any manual run can
# overlap freely and C2 receives each book exactly once. If today's book is
# late or withheld, a slot finds only yesterday's (already-sent) book and
# skips; a later slot sends today's once it lands. Outside regular hours the
# script skips too, so a very late fire is harmless.
#
# Required repo secrets: C2_API_KEY, C2_STRATEGY_ID, OVERALL_BOOK_SECRET.
# Until C2_API_KEY is set the job exits green with a notice.
#
# NOTE: `on: schedule` fires only from the repo's DEFAULT branch.

on:
  workflow_dispatch: {}   # manual / external-scheduler trigger (bypasses the 9:00 guard)
  schedule:
    # Weekdays. 14:00 UTC = 9:00 CDT (15:00 UTC = 9:00 CST); the guard skips
    # any fire before 9:00 CT. Hourly backups run to the close either way.
    - cron: "0 14-20 * * 1-5"
    # Lead slots: GitHub delivers fires ~1 h late, so these typically land
    # just after the anchor.
    - cron: "15,40 13 * * 1-5"

permissions:
  contents: write

concurrency:
  group: publish-c2
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout (this branch)
        uses: actions/checkout@v4

      - name: Guard (configured + not before 9:00 AM CT)
        id: guard
        env:
          C2_API_KEY: ${{ secrets.C2_API_KEY }}
          C2_STRATEGY_ID: ${{ secrets.C2_STRATEGY_ID }}
        run: |
          set -euo pipefail
          if [ -z "${C2_API_KEY}" ] || [ -z "${C2_STRATEGY_ID}" ]; then
            echo "::notice title=Collective2 not configured::Set the C2_API_KEY and C2_STRATEGY_ID repo secrets to enable publishing."
            echo "run=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if [ "${{ github.event_name }}" = "schedule" ]; then
            NOW="$(date -u +%s)"
            ANCHOR="$(TZ=America/Chicago date -d "$(TZ=America/Chicago date +%F) 09:00" +%s)"
            if [ "$NOW" -lt "$ANCHOR" ]; then
              echo "Before today's 9:00-AM-CT anchor — skipping."
              echo "run=false" >> "$GITHUB_OUTPUT"; exit 0
            fi
          fi
          echo "run=true" >> "$GITHUB_OUTPUT"

      - name: Set up Python
        if: steps.guard.outputs.run == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        if: steps.guard.outputs.run == 'true'
        # publish_c2.py is stdlib + pandas (same bounds as requirements.txt);
        # the model stack is not needed to forward a published book.
        run: pip install "numpy>=1.26,<2.3" "pandas>=2.1,<2.3"

      - name: Publish to Collective2
        if: steps.guard.outputs.run == 'true'
        env:
          C2_API_KEY: ${{ secrets.C2_API_KEY }}
          C2_STRATEGY_ID: ${{ secrets.C2_STRATEGY_ID }}
          OVERALL_BOOK_SECRET: ${{ secrets.OVERALL_BOOK_SECRET }}
        run: |
          # Actions runs bash with -e; turn it off so the summary is written
          # even when the publish fails, then fail the step with its status.
          set +e -o pipefail
          python scripts/publish_c2.py --file data/overall/target_book.json \
            --state data/overall/c2_publish_state.json --execute --require-signature \
            | tee c2_publish.out
          STATUS=$?
          { echo '### Collective2 publish'; echo '```'; cat c2_publish.out; echo '```'; } \
            >> "$GITHUB_STEP_SUMMARY"
          exit $STATUS

      - name: Commit the sent-book marker
        if: steps.guard.outputs.run == 'true'
        run: |
          set -euo pipefail
          git add data/overall/c2_publish_state.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No new book sent — nothing to commit."; exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          ASOF="$(jq -r '.as_of // "unknown"' data/overall/c2_publish_state.json)"
          git commit -m "chore(c2): published book as-of ${ASOF} to Collective2" \
            -m "Automated via .github/workflows/publish-c2.yml"
          # Other workflows push to this branch too; the marker is the only
          # path in this commit, so this run's copy wins any rebase conflict.
          for attempt in 1 2 3; do
            git fetch origin "${GITHUB_REF_NAME}"
            if git rebase --autostash -X theirs "origin/${GITHUB_REF_NAME}" \
               && git push origin "HEAD:${GITHUB_REF_NAME}"; then
              echo "Marker pushed on attempt ${attempt}."; exit 0
            fi
            git rebase --abort 2>/dev/null || true
            sleep $((attempt * 5))
          done
          echo "::error title=C2 marker not landed::The book WAS sent to C2 but the marker could not be pushed; a later slot may re-send it (C2 already holds these positions, so at most a few shares of resizing)."
          exit 1
