name: Publish book to Collective2

# Mirrors the day's signed PAPER target book (data/overall/target_book.json)
# onto the Collective2 strategy at 2:30 PM America/Chicago — 30 minutes before
# the close — via scripts/publish_c2.py (SetDesiredPositions, API v4).
# Runs entirely in Actions: no dependency on the executor PC.
#
# Timing: the book is published at 7:15 AM CT by publish-target-book.yml and
# the backtest assumes fills at the close, so C2 trades near it — the same
# 2:30 PM CT slot as the IBKR executor — keeping the public record aligned with
# the backtest and the IBKR account. C2 can only adjust positions while the
# market is open (until 3:00 PM CT). GitHub's `on: schedule` is best-effort
# (fires land 1–3 h late or are dropped), so the precise trigger is an external
# scheduler calling workflow_dispatch at 2:30 PM CT (docs/EXTERNAL_SCHEDULER.md
# § C2); the cron slots below are best-effort backups inside the last half hour.
#
# Idempotent by construction: publish_c2.py records the last book it sent in
# data/overall/c2_publish_state.json (committed back below), and skips a book
# already sent — so the dispatch, every backup slot and any manual run can
# overlap freely and C2 receives each book exactly once. If today's book is
# late or withheld, a slot finds only yesterday's (already-sent) book and
# skips; a later slot sends today's once it lands. Outside regular hours the
# script skips too, so a very late fire is harmless.
#
# Required repo secrets: C2_API_KEY, C2_STRATEGY_ID, OVERALL_BOOK_SECRET.
# Until C2_API_KEY is set the job exits green with a notice.
#
# NOTE: `on: schedule` fires only from the repo's DEFAULT branch.

on:
  workflow_dispatch: {}   # manual / external-scheduler trigger (bypasses the 2:30 guard)
  schedule:
    # Weekdays, every 15 min 18:00–20:45 UTC. 2:30 PM CT is 19:30 UTC (CDT) /
    # 20:30 UTC (CST); the guard skips any fire before 2:30 PM CT and the
    # publisher skips any fire after the 3:00 PM CT close, so across both DST
    # offsets only slots inside 2:30–3:00 PM CT can send. Early slots exist
    # because GitHub delivers fires late — they tend to land inside the window.
    - cron: "*/15 18-20 * * 1-5"

permissions:
  contents: write

concurrency:
  group: publish-c2
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout (this branch)
        uses: actions/checkout@v4

      - name: Guard (configured + not before 2:30 PM CT)
        id: guard
        env:
          C2_API_KEY: ${{ secrets.C2_API_KEY }}
          C2_STRATEGY_ID: ${{ secrets.C2_STRATEGY_ID }}
        run: |
          set -euo pipefail
          if [ -z "${C2_API_KEY}" ] || [ -z "${C2_STRATEGY_ID}" ]; then
            echo "::notice title=Collective2 not configured::Set the C2_API_KEY and C2_STRATEGY_ID repo secrets to enable publishing."
            echo "run=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if [ "${{ github.event_name }}" = "schedule" ]; then
            NOW="$(date -u +%s)"
            ANCHOR="$(TZ=America/Chicago date -d "$(TZ=America/Chicago date +%F) 14:30" +%s)"
            if [ "$NOW" -lt "$ANCHOR" ]; then
              echo "Before today's 2:30-PM-CT anchor — skipping."
              echo "run=false" >> "$GITHUB_OUTPUT"; exit 0
            fi
          fi
          echo "run=true" >> "$GITHUB_OUTPUT"

      - name: Set up Python
        if: steps.guard.outputs.run == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        if: steps.guard.outputs.run == 'true'
        # publish_c2.py is stdlib + pandas (same bounds as requirements.txt);
        # the model stack is not needed to forward a published book.
        run: pip install "numpy>=1.26,<2.3" "pandas>=2.1,<2.3"

      - name: Publish to Collective2
        if: steps.guard.outputs.run == 'true'
        env:
          C2_API_KEY: ${{ secrets.C2_API_KEY }}
          C2_STRATEGY_ID: ${{ secrets.C2_STRATEGY_ID }}
          OVERALL_BOOK_SECRET: ${{ secrets.OVERALL_BOOK_SECRET }}
        run: |
          # Actions runs bash with -e; turn it off so the summary is written
          # even when the publish fails, then fail the step with its status.
          set +e -o pipefail
          python scripts/publish_c2.py --file data/overall/target_book.json \
            --state data/overall/c2_publish_state.json --execute --require-signature \
            | tee c2_publish.out
          STATUS=$?
          { echo '### Collective2 publish'; echo '```'; cat c2_publish.out; echo '```'; } \
            >> "$GITHUB_STEP_SUMMARY"
          exit $STATUS

      # What the C2 model account actually holds (shares + average fill),
      # for the Overall app's 💼 Current Positions. Read-only; runs on every
      # slot so the fills of a book sent in an earlier slot land here, and
      # the file is only rewritten when the holdings change (or once a day).
      - name: Snapshot C2 positions
        if: always() && steps.guard.outputs.run == 'true'
        continue-on-error: true
        env:
          C2_API_KEY: ${{ secrets.C2_API_KEY }}
          C2_STRATEGY_ID: ${{ secrets.C2_STRATEGY_ID }}
        run: |
          set -euo pipefail
          # a book was just sent: give C2's market orders a moment to fill
          if ! git diff --quiet -- data/overall/c2_publish_state.json; then
            sleep 60
          fi
          python scripts/publish_c2.py --snapshot \
            --state data/overall/c2_publish_state.json \
            --snapshot-file data/overall/c2_positions.json

      - name: Commit the sent-book marker and positions snapshot
        if: steps.guard.outputs.run == 'true'
        run: |
          set -euo pipefail
          git add data/overall/c2_publish_state.json data/overall/c2_positions.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No new book sent and holdings unchanged — nothing to commit."; exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --cached --quiet -- data/overall/c2_publish_state.json; then
            MSG="chore(c2): positions snapshot"
          else
            ASOF="$(jq -r '.as_of // "unknown"' data/overall/c2_publish_state.json)"
            MSG="chore(c2): published book as-of ${ASOF} to Collective2"
          fi
          git commit -m "${MSG}" \
            -m "Automated via .github/workflows/publish-c2.yml"
          # Other workflows push to this branch too; the marker and snapshot
          # are the only paths in this commit, so this run's copy wins any
          # rebase conflict.
          for attempt in 1 2 3; do
            git fetch origin "${GITHUB_REF_NAME}"
            if git rebase --autostash -X theirs "origin/${GITHUB_REF_NAME}" \
               && git push origin "HEAD:${GITHUB_REF_NAME}"; then
              echo "Marker pushed on attempt ${attempt}."; exit 0
            fi
            git rebase --abort 2>/dev/null || true
            sleep $((attempt * 5))
          done
          echo "::error title=C2 marker not landed::The book WAS sent to C2 but the marker could not be pushed; a later slot may re-send it (C2 already holds these positions, so at most a few shares of resizing)."
          exit 1
