name: Refresh backtest dataset

# Keeps data/backtest/raw_features_daily.csv (and the sibling CSVs + manifest)
# current so the live app has a fresh on-chain fallback when blockchain.info is
# unreachable from the deploy host. The pull script fetches BTC + macro +
# on-chain + Coinbase premium; a guard script blocks any commit that would
# regress the versioned dataset, so a failed/partial pull can never overwrite
# the known-good CSV.

on:
  schedule:
    # Daily at 12:03 UTC — minutes after the 12:00-UTC (7am-CT summer) daily
    # bar closes, so the newest completed BTC bar lands in the versioned CSV
    # BEFORE the 7:15-AM-CT "Publish target book" daily cycle audits signal
    # freshness. GitHub cron is best-effort (fires get delayed or dropped), so
    # a second slot retries an hour later — the commit step is idempotent (it
    # commits only when the CSV actually changed). The publish workflow also
    # re-pulls synchronously itself, so even a fully missed day here cannot
    # make the publish stale.
    - cron: "3 12 * * *"
    - cron: "3 13 * * *"
    # 2026-09-01: BOTH slots above were dropped outright (the last run before the
    # day's publish was 2026-08-31 19:27 UTC), so no sleeve snapshot was pinned
    # for the 08-31 session and the publish had nothing current to fall back on.
    # GitHub cron is best-effort — fires are routinely delayed an hour or more
    # and are sometimes dropped entirely — so the cycle gets catch-up slots, the
    # same hardening .github/workflows/publish-target-book.yml already carries.
    # Every step here is idempotent (the commits fire only when a file actually
    # changed, and refresh_sleeve_snapshots.py pins completed bars at the publish
    # anchor), so a slot on a day that already refreshed costs one no-op run.
    - cron: "3 14-23 * * *"
  workflow_dispatch: {}   # allow manual runs from the Actions tab

# Allow the built-in token to push the refreshed data back to the branch.
permissions:
  contents: write

# Never let two refreshes race; let an in-flight one finish.
concurrency:
  group: refresh-backtest-data
  cancel-in-progress: false

env:
  # Alarm (fail the job) when the dataset is older than this, so a silently
  # broken pipeline is visible before the app's ffill(limit=5) stops covering.
  MAX_STALE_DAYS: "5"

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install data-pull dependencies
        run: |
          python -m pip install --upgrade pip
          # Match the app's pins (requirements.txt) for the libraries the pull
          # script uses; the model/streamlit stack isn't needed to refresh data.
          pip install "numpy>=1.26,<2.3" "pandas>=2.1,<2.3" "requests>=2.31" "yfinance>=0.2.40"

      - name: Pull fresh dataset (BTC + macro + on-chain + Coinbase premium)
        id: pull
        # The pull script exits non-zero on soft QC warnings (e.g. an equity
        # source lagging) even when it wrote a good CSV; the guard below — not
        # this exit code — decides whether the result is safe to commit.
        continue-on-error: true
        run: python scripts/pull_backtest_data.py

      - name: Validate refreshed CSV (block regressions)
        run: python scripts/validate_refreshed_data.py

      - name: Commit & push refreshed data
        run: |
          set -euo pipefail
          if git diff --quiet -- data/backtest/; then
            echo "No changes to data/backtest/ — nothing to commit."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/backtest/
          NEWDATE="$(python -c "import pandas as pd; print(pd.read_csv('data/backtest/raw_features_daily.csv', index_col=0, parse_dates=True).index.max().date())")"
          git commit \
            -m "chore(data): refresh backtest dataset (through ${NEWDATE})" \
            -m "Automated refresh via .github/workflows/refresh-backtest-data.yml"
          # The publish workflow pushes to the same branch on an overlapping
          # schedule; rebase (autostashing the sleeve files the gate may have
          # rewritten) so a race retries instead of failing the job.
          git fetch origin "${GITHUB_REF_NAME}"
          git rebase --autostash "origin/${GITHUB_REF_NAME}" || git rebase --abort || true
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Refresh + QC-pin the equity/gold sleeve snapshots
        # Runs the same quality gate the apps use (app/data_gate.py) for every
        # ticker sleeve + the shared gold dataset: a fetch that passes QC
        # replaces data/<sleeve>/macro_daily.csv and writes a checksummed
        # manifest beside it; a fetch that fails QC is discarded and the last
        # known-good snapshot stays (that sleeve is reported, not committed).
        # Committing the pinned vintage means every deployment boots from the
        # SAME validated history instead of re-trusting a live Yahoo fetch —
        # which is what kept making the backtest numbers drift intraday.
        continue-on-error: true
        run: python scripts/refresh_sleeve_snapshots.py

      - name: Commit & push refreshed sleeve snapshots
        run: |
          set -euo pipefail
          PATHS="data/arty data/gldm data/grid data/pbw data/remx data/soxx data/wgmi data/xle"
          # porcelain (not diff) so brand-new manifest files count as changes
          if [ -z "$(git status --porcelain -- $PATHS)" ]; then
            echo "No sleeve snapshot changes — nothing to commit."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add $PATHS
          git commit \
            -m "chore(data): refresh QC-pinned sleeve snapshots" \
            -m "Automated refresh via scripts/refresh_sleeve_snapshots.py (quality-gated; see app/data_gate.py)"
          git fetch origin "${GITHUB_REF_NAME}"
          git rebase --autostash "origin/${GITHUB_REF_NAME}" || git rebase --abort || true
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Alarm if dataset is stale
        # Runs whether or not anything was committed: surfaces a silently broken
        # pipeline (e.g. the pull crashing for days) before the app degrades.
        run: |
          python - <<'PY'
          import os, sys
          from datetime import datetime, timezone
          import pandas as pd
          df = pd.read_csv("data/backtest/raw_features_daily.csv",
                           index_col=0, parse_dates=True)
          last = df.index.max().normalize()
          today = pd.Timestamp(datetime.now(timezone.utc).date())  # naive UTC date
          age = (today - last).days
          limit = int(os.environ.get("MAX_STALE_DAYS", "5"))
          print(f"dataset last date {last.date()} — {age} day(s) old (limit {limit})")
          if age > limit:
              print(f"::error::backtest dataset is {age} days stale (> {limit}); "
                    "the daily refresh is not producing fresh data")
              sys.exit(1)
          PY
