name: Publish target book (IBKR Option C)

# Option C, publisher side. Recomputes the OVERALL strategy on a schedule,
# AUDITS every signal app's freshness, and (only on a passing audit) commits the
# live-adjusted target-book artifacts (data/overall/target_book*.json) plus the
# audit trail (data/overall/daily_audit.json) back to THIS branch, so a local
# executor next to IB Gateway can `git pull` (or fetch the raw URL) and
# rebalance an IBKR account without running the model itself.
#
# SCHEDULE — ONE publish cycle per day, every day (Bitcoin trades — and
# BTC-driven signals move — on weekends and US market holidays too; the
# weekend/holiday guard lives ONLY on the executor side):
#
#   * DAILY cycle — starts 7:15 AM US Central (America/Chicago), 15 minutes
#     after the Bitcoin daily bar closes (12:00 UTC = 7:00 AM CDT), so the
#     Overall strategy sees BTC's fresh 7:00-AM-CT bar AND every equity app's
#     prior 4:00-PM-ET close. The DAILY AUDIT runs ONCE, first — and only a
#     passing audit lets the Target Book publish. This is the book the
#     2:30-PM-CT (3:30 PM ET) executor trades.
#
# The book is published ONCE per day by this workflow and then stays frozen
# until the next morning's cycle — it must NOT update again during the day.
# The only way to publish a new book intraday is an explicit user action: the
# 🚀 "Publish new target book" button in the Target Book app (or a manual
# workflow_dispatch from the Actions tab), both of which bypass the guard.
#
# GitHub's `on: schedule` is BEST-EFFORT: fires are routinely delayed 1–2 h and
# are sometimes dropped entirely (observed: no scheduled fire at all on some
# days). So the cycle gets SEVERAL cron slots, and the guard below is purely
# idempotent — every slot asks "has today's book been published yet?" and
# publishes if not, no matter the wall-clock hour. A day can only be missed if
# EVERY slot is dropped. Cron is UTC-only (no DST), so the slots cover both
# 7:15 AM CDT (12:15 UTC) and 7:15 AM CST (13:15 UTC); the guard resolves the
# true cycle start via America/Chicago.
#
# 2026-07-25: the slot window was widened 12–17 → 12–23 UTC. A transient upstream
# feed lag (Yahoo had not yet served Friday's daily bar for the ETF universe on the
# first-ever weekend run) made the audit fail; with only six slots the day risked
# ending unpublished. The guard is idempotent and the book's basis is pinned to the
# 7:15-AM-CT anchor, so a later slot publishes exactly the book the morning run
# would have — extra slots cost nothing on a day that already published.
#
# For an EXACTLY-on-time fire (optional hardening), point any external
# scheduler (cron-job.org, Cloud Scheduler, the executor VM's crontab) at the
# GitHub API's workflow_dispatch endpoint for this file at the desired times:
#   curl -X POST -H "Authorization: Bearer $GH_TOKEN" \
#     https://api.github.com/repos/OWNER/REPO/actions/workflows/publish-target-book.yml/dispatches \
#     -d '{"ref":"main"}'
# API dispatch fires precisely; the cron slots below then remain as backup.
#
# 2026-08-03: that hardening is LIVE. GitHub dropped EVERY scheduled fire for
# 2.5+ hours this morning (zero runs by 8:45 AM CT), so an external scheduler
# now drives the on-time publish: a cron-job.org job calls the
# workflow_dispatch API daily at 7:16 AM America/Chicago (timezone-aware
# schedule, so the CDT/CST switch is automatic) using a fine-grained PAT
# (Actions: read & write, this repo only). Setup + rationale:
# docs/EXTERNAL_SCHEDULER.md. A dispatch bypasses the schedule guard, but the
# book's basis stays pinned to the 7:15-AM-CT anchor and a same-day
# re-publish is idempotent, so overlap with a late-delivered cron fire is
# harmless. The cron slots below remain as backup; dispatch-publish.yml is a
# tokenless fallback relay for automation whose credentials lack the Actions
# scope.
#
# NOTE: `on: schedule` fires only from the repo's DEFAULT branch. workflow_dispatch
# also stays, for manual runs / first tests (it bypasses the schedule guard).

on:
  workflow_dispatch: {}   # manual run (Actions tab → Run workflow)
  schedule:
    # DAILY cycle (starts 7:15 AM America/Chicago) — primary slot + catch-up
    # retries. 12:15 UTC = 7:15 CDT primary (13:15 UTC covers 7:15 CST); later
    # slots only fire if the day's book still isn't published (guard-skipped
    # otherwise).
    - cron: "15 12-23 * * *"   # 12:15 … 23:15 UTC hourly (was 12-17)
    - cron: "45 12,13 * * *"   # 12:45, 13:45 UTC (dense early retries)
    # 2026-07-30: pre-anchor LEAD slots. Every publish since this workflow was
    # created landed 13:54–17:07 UTC: GitHub delivered each cron fire ~1 h late
    # (often more) and dropped the day's first slots outright, so with the
    # earliest slot sitting exactly AT the 12:15 UTC anchor the day's book was
    # chronically 1.5–3 h late and the app showed yesterday's Targetbooks all
    # morning. These slots fire BEFORE the anchor so that, after GitHub's
    # routine delivery delay, they arrive shortly AFTER it and publish on time.
    # Risk-free by construction: the guard below skips any fire that arrives
    # before the day's 7:15-AM-CT anchor, and the book's data basis is pinned
    # to that anchor — so a lead fire can neither publish early nor publish a
    # different book than the 12:15 slot would have.
    - cron: "5,25,45 11 * * *" # 11:05/11:25/11:45 UTC → typically land ≥12:15

# contents: write to push the artifacts back to the branch; issues: write so a
# failed run can open / update a tracking issue (see the "Report failure" step).
permissions:
  contents: write
  issues: write

concurrency:
  group: publish-target-book
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout (this branch)
        uses: actions/checkout@v4

      - name: Publish-cycle guard (idempotent — once per day, run until published)
        id: guard
        # Every cron slot asks the same question: "has TODAY's book been
        # published yet?" — and runs only if not. The single daily cycle starts
        # at 7:15 AM America/Chicago (Bitcoin bar close 7:00 AM CT + 15 min).
        # Once a book is published for the day, every later scheduled fire
        # skips — the book stays frozen until tomorrow's cycle. Only a manual
        # dispatch (the UI's 🚀 publish button / the Actions tab) bypasses this.
        # No wall-clock whitelist: an arbitrarily delayed cron fire still
        # publishes if today's book is missing, instead of silently skipping
        # the day.
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "Manual dispatch (user-requested publish) — always runs."
            echo "run=true"    >> "$GITHUB_OUTPUT"
            echo "slot=manual" >> "$GITHUB_OUTPUT"; exit 0
          fi
          NOW="$(date -u +%s)"
          CYCLE_START="$(TZ=America/Chicago date -d "$(TZ=America/Chicago date +%F) 07:15" +%s)"
          if [ "$NOW" -lt "$CYCLE_START" ]; then
            echo "Before today's 7:15-AM-CT daily cycle (a UTC fire ahead of the"
            echo "Central-time anchor) — yesterday's cycle is done; skipping."
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "slot=none" >> "$GITHUB_OUTPUT"; exit 0
          fi
          SLOT="daily"
          echo "Current cycle: $SLOT (started $(date -u -d "@$CYCLE_START" -Iseconds))."
          # Was today's book already published? (jq is preinstalled.) A manual
          # user publish after 7:15 CT counts too — the day's book then stays
          # as the user published it.
          PUBLISHED="false"
          if [ -f data/overall/daily_audit.json ]; then
            GEN_UTC="$(jq -r '.generated_at_utc // empty' data/overall/daily_audit.json || true)"
            OK="$(jq -r '.target_book.published // false' data/overall/daily_audit.json || echo false)"
            if [ -n "$GEN_UTC" ] && [ "$OK" = "true" ]; then
              GEN_EPOCH="$(date -u -d "$GEN_UTC" +%s || echo 0)"
              [ "$GEN_EPOCH" -ge "$CYCLE_START" ] && PUBLISHED="true"
            fi
          fi
          if [ "$PUBLISHED" = "true" ]; then
            echo "Today's book is already published (at $GEN_UTC) — skipping."
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "No published book for today yet — running."
            echo "run=true"  >> "$GITHUB_OUTPUT"
          fi
          echo "slot=$SLOT" >> "$GITHUB_OUTPUT"

      - name: Set up Python
        if: steps.guard.outputs.run == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"          # the app's pinned interpreter (loads the model)

      - name: Install engine dependencies
        if: steps.guard.outputs.run == 'true'
        run: |
          python -m pip install --upgrade pip
          # The publisher runs the full universe (model inference), so it needs the
          # app's tested stack — NOT the broker layer (ib_async is executor-only).
          pip install -r requirements.txt

      - name: Refresh BTC feature data (synchronous, guarded)
        if: steps.guard.outputs.run == 'true'
        # The BTC/MSTR/MSTU sleeve reads data/backtest/raw_features_daily.csv.
        # Pull it fresh RIGHT NOW (the newest BTC bar closed at 12:00 UTC =
        # 7:00 AM CDT — minutes before the daily cycle) so the freshness audit
        # sees today's completed bar. The validation
        # guard restores the committed CSV on any regression, so a failed pull
        # can never poison the engine run — worst case the audit (correctly)
        # flags BTC stale and the publish is withheld.
        run: |
          set +e
          python scripts/pull_backtest_data.py
          echo "pull exit: $? (soft QC warnings tolerated — the validator decides)"
          set -e
          if python scripts/validate_refreshed_data.py; then
            echo "Refreshed dataset validated."
          else
            echo "Refreshed dataset REGRESSED — restoring the committed version."
            git checkout -- data/backtest/ || true
          fi

      - name: Publish target book (audited)
        if: steps.guard.outputs.run == 'true'
        id: publish
        # The DAILY AUDIT runs exactly once here, BEFORE the book is written:
        # publish_target_book.py audits every app's freshness first, retries
        # once after a refresh, and exits 2 (writing the audit trail but NO
        # book) if anything is still stale — stale signals never publish.
        # It also rotates the outgoing book to target_book*_prev.json so the
        # UI can show the "Previous Targetbook" donut.
        # continue-on-error lets the commit step push that audit trail; the job
        # is then failed loudly by the "Fail if publish failed" step below.
        continue-on-error: true
        env:
          # Set this repo/environment secret to HMAC-sign the artifact so the
          # executor can verify authenticity. Unset → an unsigned book (a warning).
          OVERALL_BOOK_SECRET: ${{ secrets.OVERALL_BOOK_SECRET }}
        # No --profile flag: the script follows the app's DEFAULT_PROFILE
        # (overall_core.DEFAULT_PROFILE), so the published book always matches
        # the profile the Overall app defaults to.
        run: python scripts/publish_target_book.py

      - name: Build strategy-health snapshot (best-effort)
        if: steps.guard.outputs.run == 'true'
        # 🩺 The decay monitor (STRATEGY_HEALTH.md): re-runs the universe plus
        # the walk-forward replay per monitored profile and writes
        # data/overall/strategy_health.json + health_history.csv, which the
        # Strategy Health app renders read-only. Best-effort by design — a
        # health-build failure must never block or unpublish the day's book.
        continue-on-error: true
        run: python scripts/build_strategy_health.py

      - name: Commit & push the artifacts (this branch only)
        if: steps.guard.outputs.run == 'true'
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Stage FIRST, then test the staged diff. `git diff --quiet <path>`
          # compares tracked files only, so on the first-ever publish (an
          # untracked file) it would report "no change" and skip the commit — the
          # run goes green but nothing lands. `git add` + `git diff --cached`
          # detects a brand-new file too. The audit trail + refreshed BTC data
          # are committed EVEN when the audit failed and no book was written, so
          # the 🕵️ Daily Audit tab shows the stale-run record.
          # data/<sleeve> is included because the engine run above re-pins any
          # sleeve whose fetch passed quality control (app/data_gate.py). Those
          # snapshots used to be left unstaged and thrown away with the runner,
          # so every run re-fetched full history and re-trusted a live Yahoo
          # response — exactly the drift the gate exists to prevent — AND they
          # were the "unstaged changes" that made the rebase below fail on every
          # single run.
          # Staged ONE PATH AT A TIME on purpose: `git add a b c` stages NOTHING
          # when any single pathspec matches no file, and the trailing `|| true`
          # then hid it — so a cycle where an optional artifact is absent (no
          # *_prev.json before the first rotation, no book_archive yet) would
          # commit nothing, report "No changes", and go green having published
          # nothing. Per-path keeps the others landing.
          for p in data/overall/target_book.json data/overall/target_book_live.json \
                   data/overall/target_book_prev.json data/overall/target_book_live_prev.json \
                   data/overall/book_archive/ \
                   data/overall/strategy_health.json data/overall/health_history.csv \
                   data/overall/daily_audit.json data/backtest/ \
                   data/arty data/gldm data/grid data/pbw data/remx data/soxx \
                   data/wgmi data/xle; do
            git add "$p" 2>/dev/null || echo "  (skipped absent path: $p)"
          done
          if git diff --cached --quiet; then
            echo "No changes — nothing to commit."
            exit 0
          fi
          if [ -f data/overall/daily_audit.json ]; then
            ASOF="$(jq -r '.overall.as_of // "unknown"' data/overall/daily_audit.json)"
            OK="$(jq -r '.audit.passed' data/overall/daily_audit.json)"
          else
            ASOF="unknown"; OK="unknown"
          fi
          git commit \
            -m "chore(ibkr): scheduled ${{ steps.guard.outputs.slot }}-cycle publish (as-of ${ASOF}, audit passed=${OK})" \
            -m "Automated via .github/workflows/publish-target-book.yml"
          # Land the artifacts on top of whatever is on the branch RIGHT NOW.
          #
          # Two publish runs legitimately overlap: a delayed cron slot and the
          # UI's 🚀 button (a dispatch deliberately bypasses the guard) can run
          # minutes apart, and the data-refresh workflow pushes to the same
          # branch. Both regenerate the SAME files with different timestamps and
          # content hashes, so a plain rebase conflicts on every artifact —
          # observed 2026-09-01 run #493: 17 conflicts, the abort left HEAD
          # behind the remote, the push was rejected non-fast-forward and the
          # run's work was silently lost.
          #
          # These paths are machine-generated from ONE pinned 7:15-AM-CT basis,
          # so the resolution is deterministic rather than a judgement call:
          # this run's freshly-computed output wins. `-X theirs` in a rebase
          # means the commit being replayed (ours), not the new base — verified,
          # and it settles add/add on a new book_archive/<date>.json too. Only
          # the generated data paths staged above are in the commit, so nothing
          # else is in range of that strategy.
          #
          # --autostash keeps anything still unstaged (runtime/ scratch, a sleeve
          # the gate rewrote after the add) from aborting the rebase outright,
          # which is what the old `git pull --rebase || true` hit on every run.
          for attempt in 1 2 3; do
            git fetch origin "${GITHUB_REF_NAME}"
            if git rebase --autostash -X theirs "origin/${GITHUB_REF_NAME}"; then
              if git push origin "HEAD:${GITHUB_REF_NAME}"; then
                echo "Artifacts pushed on attempt ${attempt}."
                exit 0
              fi
            else
              git rebase --abort || true
            fi
            echo "Concurrent push on attempt ${attempt} — refetching and retrying."
            sleep $((attempt * 5))
          done
          echo "::error title=Publish artifacts not landed::Could not push the \
            target book after 3 attempts against a moving branch."
          exit 1

      - name: Classify + record the failure (stale-withheld vs engine error)
        id: classify
        if: steps.guard.outputs.run == 'true' && steps.publish.outcome != 'success'
        # publish_target_book.py exits 2 when the freshness audit failed and the
        # book was deliberately WITHHELD (a designed, safe outcome — the executor
        # keeps the previous verified book); any other non-zero exit is a real
        # engine/data error. Surface which, plus the stale app list, into the job
        # summary so the cause is visible WITHOUT relying on Issues being enabled
        # (they are disabled on this repo — see the "Report failure" step).
        run: |
          set -uo pipefail
          KIND="error"; STALE="unknown"; ASOF="unknown"; REASON=""; DAYS=1; GATES=""
          if [ -f data/overall/daily_audit.json ]; then
            ASOF="$(jq -r '.overall.as_of // "unknown"' data/overall/daily_audit.json)"
            STALE="$(jq -r '(.audit.stale_apps // []) | join(", ")' data/overall/daily_audit.json)"
            REASON="$(jq -r '.target_book.skip_reason // ""' data/overall/daily_audit.json)"
            DAYS="$(jq -r '.target_book.consecutive_withheld_days // 1' data/overall/daily_audit.json)"
            # Why each stale app is stale — the data gate's own verdict, which
            # used to exist only in a gitignored runtime file nobody ever saw.
            GATES="$(jq -r '[.audit.rows[]? | select(.fresh == false)
                             | "- `\(.app)` as-of `\(.actual_asof)` — gate: `\(.data_gate.decision // "n/a")`"
                             + (if (.data_gate.failed_checks // []) | length > 0
                                then " (failed: `" + ((.data_gate.failed_checks) | join(", ")) + "`)"
                                else "" end)] | join("\n")' \
                        data/overall/daily_audit.json 2>/dev/null || true)"
            # NB: jq's `//` treats `false` as empty, so `.audit.passed // "unknown"`
            # would report "unknown" for a genuinely FAILED audit and misclassify a
            # withheld book as an engine error. Test for the key, then stringify.
            PASSED="$(jq -r 'if (.audit | has("passed")) then (.audit.passed | tostring) else "unknown" end' data/overall/daily_audit.json)"
            [ "$PASSED" = "false" ] && KIND="withheld"
          fi
          echo "kind=$KIND" >> "$GITHUB_OUTPUT"
          {
            if [ "$KIND" = "withheld" ]; then
              echo "### ⏸️ Target book WITHHELD (signal-freshness audit failed)"
              echo ""
              echo "This is the **designed safe path**, not a crash: stale signals are never"
              echo "published. The IBKR executor keeps the previous verified book and its own"
              echo "freshness guard skips trading if that book ages out — so no bad orders."
              echo ""
              echo "- Stale apps: \`${STALE:-none}\`"
              echo "- Engine as-of: \`${ASOF}\`"
              echo "- Withheld for: \`${DAYS}\` consecutive daily cycle(s)"
              [ -n "$REASON" ] && echo "- Reason: \`${REASON}\`"
              echo ""
              if [ -n "$GATES" ]; then
                echo "**Per-app data-gate verdict**"
                echo ""
                echo "$GATES"
                echo ""
              fi
              echo "A later catch-up slot re-runs automatically and publishes once the feeds"
              echo "catch up (the guard is idempotent, and the book's basis stays pinned to"
              echo "today's 7:15 AM CT anchor, so a later publish yields the same book)."
            else
              echo "### ❌ Target-book publish ERRORED"
              echo ""
              echo "The publish step exited non-zero for a reason other than a failed"
              echo "freshness audit (engine, data feed, or dependency error). See the step log."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          # A withhold on its FIRST cycle is the designed safe path and usually
          # clears at the next catch-up slot, so it annotates loudly but does not
          # fail the job — otherwise a transient feed lag is indistinguishable
          # from a crash and the red X stops meaning anything. A withhold that
          # persists into a second cycle is a real outage: fail, and let the
          # "Report failure" step raise it.
          if [ "$KIND" = "withheld" ] && [ "${DAYS:-1}" -le 1 ]; then
            echo "::warning title=Target book withheld::Freshness audit failed (stale: ${STALE:-none}) — book not published; a catch-up slot will retry today."
            exit 0
          fi
          if [ "$KIND" = "withheld" ]; then
            echo "::error title=Target book STILL withheld::No book published for ${DAYS} consecutive cycles (stale: ${STALE:-none}) — the feeds are not recovering on their own."
          else
            echo "::error title=Target-book publish errored::Publish step outcome ${{ steps.publish.outcome }} (not an audit refusal) — see log."
          fi
          exit 1

      - name: Upload the data-gate audit trail
        # runtime/dataset_audit.json records every sleeve's gate decision
        # (pinned / refreshed / fallback_snapshot / live_unvalidated) with the
        # failed checks and content hashes. It is gitignored, so before this it
        # died with the runner and a stale sleeve had to be re-diagnosed from
        # scratch. Always uploaded — a GREEN run's trail is what you diff
        # against when the next one goes red.
        if: always() && steps.guard.outputs.run == 'true'
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: dataset-audit-${{ github.run_id }}
          path: |
            runtime/dataset_audit.json
            data/overall/daily_audit.json
          if-no-files-found: ignore
          retention-days: 30

      # Make a broken publish loud: on any failure above, open a tracking issue
      # (or comment on the existing open one, so daily failures don't spam new
      # issues). The job itself already shows red in the Actions tab; this surfaces
      # it to anyone watching issues / notifications too.
      - name: Report failure
        if: failure()
        # MUST NOT throw. This repo has Issues DISABLED, so the create/comment
        # calls return HTTP 410 ("Issues has been disabled in this repository")
        # and an unguarded script fails the step with an "Unhandled error" that
        # buries the real cause (observed 2026-07-25). Every API call is wrapped:
        # if issue reporting is unavailable we fall back to the job summary +
        # an annotation, which the "Classify" step above has already written.
        # continue-on-error is belt-and-braces so the reporter can never be the
        # thing that decides the job's status.
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          script: |
            const label = 'publish-failure';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const when = new Date().toISOString();
            const body = [
              `The **Publish target book** workflow failed.`,
              ``,
              `- Run: ${runUrl}`,
              `- Trigger: \`${context.eventName}\``,
              `- Time: ${when}`,
              ``,
              `If the signal-freshness audit failed, the book was intentionally WITHHELD `,
              `(stale signals are never published) — see data/overall/daily_audit.json and `,
              `the 🕵️ Daily Audit tab. The IBKR executor's freshness guard will skip trading `,
              `rather than act on a stale book, so no bad orders result — but today's book `,
              `was not published. Check the run log above.`,
            ].join('\n');
            // Issues may be DISABLED on this repo (HTTP 410) or the token may
            // lack scope — either way, reporting must degrade, never throw.
            const disabled = (e) =>
              e?.status === 410 || e?.status === 404 || e?.status === 403;
            try {
              // find an existing open failure issue to avoid one-per-day spam
              const existing = await github.rest.issues.listForRepo({
                owner: context.repo.owner, repo: context.repo.repo,
                state: 'open', labels: label, per_page: 1,
              });
              if (existing.data.length) {
                await github.rest.issues.createComment({
                  owner: context.repo.owner, repo: context.repo.repo,
                  issue_number: existing.data[0].number, body,
                });
              } else {
                // ensure the label exists (ignore error if it already does)
                try {
                  await github.rest.issues.createLabel({
                    owner: context.repo.owner, repo: context.repo.repo,
                    name: label, color: 'd24444',
                    description: 'Automated: target-book publish failed',
                  });
                } catch (e) { /* label already exists */ }
                await github.rest.issues.create({
                  owner: context.repo.owner, repo: context.repo.repo,
                  title: '⚠️ Target-book publish failed',
                  body, labels: [label],
                });
              }
              core.info('Failure reported to Issues.');
            } catch (e) {
              const why = disabled(e)
                ? `Issues are unavailable on this repository (HTTP ${e.status}) — ` +
                  `falling back to the job summary.`
                : `Issue reporting failed (${e?.status ?? '?'}: ${e?.message ?? e}) — ` +
                  `falling back to the job summary.`;
              core.warning(why);
              await core.summary
                .addRaw(`\n\n> ℹ️ ${why}\n\n`)
                .addRaw(body)
                .write();
            }
