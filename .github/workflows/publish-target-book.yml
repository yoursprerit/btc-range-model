name: Publish target book (IBKR Option C)

# Option C, publisher side. Runs the Overall engine and commits the live-adjusted
# target-book artifact (data/overall/target_book.json) back to THIS branch, so a
# local executor next to IB Gateway can `git pull` (or fetch the raw URL) and
# rebalance an IBKR paper account without running the model itself.
#
# NOTE: `on: schedule` fires only from the repo's DEFAULT branch — which this
# file is now on, so the daily cron below is live. workflow_dispatch also stays,
# for manual runs / first tests.

on:
  workflow_dispatch: {}   # manual run (Actions tab → Run workflow)
  schedule:
    # 12:30 UTC EVERY day — Bitcoin trades (and BTC-driven signals move) on
    # weekends and US market holidays too, so a fresh book is published daily.
    # The weekend/holiday guard lives ONLY on the executor side
    # (ibkr_execute_book.py / ibkr_rebalance.py), which still trades exclusively
    # on US market days. The time is after the prior US daily bar has closed,
    # and BEFORE the laptop executor's 09:45-ET run in BOTH DST regimes (09:45
    # EDT = 13:45 UTC, 09:45 EST = 14:45 UTC), so the executor's `git pull`
    # always gets a fresh book. GitHub cron is UTC-only (no DST) and
    # best-effort — a late fire is safe: the executor's freshness guard just
    # skips rather than trading stale.
    - cron: "30 12 * * *"

# contents: write to push the artifact back to the branch; issues: write so a
# failed run can open / update a tracking issue (see the "Report failure" step).
permissions:
  contents: write
  issues: write

concurrency:
  group: publish-target-book
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout (this branch)
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"          # the app's pinned interpreter (loads the model)

      - name: Install engine dependencies
        run: |
          python -m pip install --upgrade pip
          # The publisher runs the full universe (model inference), so it needs the
          # app's tested stack — NOT the broker layer (ib_async is executor-only).
          pip install -r requirements.txt

      - name: Publish target book
        env:
          # Set this repo/environment secret to HMAC-sign the artifact so the
          # executor can verify authenticity. Unset → an unsigned book (a warning).
          OVERALL_BOOK_SECRET: ${{ secrets.OVERALL_BOOK_SECRET }}
        run: python scripts/publish_target_book.py --profile Aggressive

      - name: Commit & push the artifact (this branch only)
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Stage FIRST, then test the staged diff. `git diff --quiet <path>`
          # compares tracked files only, so on the first-ever publish (an
          # untracked file) it would report "no change" and skip the commit — the
          # run goes green but nothing lands. `git add` + `git diff --cached`
          # detects a brand-new file too.
          git add data/overall/target_book.json data/overall/target_book_live.json
          if git diff --cached --quiet -- data/overall/target_book.json data/overall/target_book_live.json; then
            echo "No change to the target books — nothing to commit."
            exit 0
          fi
          ASOF="$(python -c "import json; print(json.load(open('data/overall/target_book.json'))['as_of'])")"
          git commit \
            -m "chore(ibkr): publish target books paper+live (as-of ${ASOF})" \
            -m "Automated via .github/workflows/publish-target-book.yml"
          # Push back to the branch this workflow was dispatched from.
          git push origin "HEAD:${GITHUB_REF_NAME}"

      # Make a broken publish loud: on any failure above, open a tracking issue
      # (or comment on the existing open one, so daily failures don't spam new
      # issues). The job itself already shows red in the Actions tab; this surfaces
      # it to anyone watching issues / notifications too.
      - name: Report failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const label = 'publish-failure';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const when = new Date().toISOString();
            const body = [
              `The **Publish target book** workflow failed.`,
              ``,
              `- Run: ${runUrl}`,
              `- Trigger: \`${context.eventName}\``,
              `- Time: ${when}`,
              ``,
              `The IBKR executor's freshness guard will skip trading rather than act on a stale book, `,
              `so no bad orders result — but today's book was not published. Check the run log above.`,
            ].join('\n');
            // find an existing open failure issue to avoid one-per-day spam
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: 'open', labels: label, per_page: 1,
            });
            if (existing.data.length) {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: existing.data[0].number, body,
              });
            } else {
              // ensure the label exists (ignore error if it already does)
              try {
                await github.rest.issues.createLabel({
                  owner: context.repo.owner, repo: context.repo.repo,
                  name: label, color: 'd24444',
                  description: 'Automated: target-book publish failed',
                });
              } catch (e) { /* label already exists */ }
              await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo,
                title: '⚠️ Target-book publish failed',
                body, labels: [label],
              });
            }
